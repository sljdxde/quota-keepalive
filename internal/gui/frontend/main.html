<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex;
         flex-direction: column; }
  header { display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #ddd;
           -webkit-app-region: drag; }
  header .spacer { flex: 1; }
  #settings { -webkit-app-region: no-drag; border: 0; background: none; cursor: pointer;
              font-size: 16px; }
  nav { display: flex; border-bottom: 1px solid #ddd; }
  nav button { flex: 1; padding: 10px; border: 0; background: none; cursor: pointer;
               border-bottom: 2px solid transparent; }
  nav button.active { border-bottom-color: #0ea371; color: #0ea371; }
  main { flex: 1; padding: 16px; overflow: auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
  .health.reauth_required { color: #ff9f0a; }
  .health.disabled { color: #ff5f57; }
  .health.healthy { color: #30d158; }
  .health.no_account { color: #8e8e93; }
  .result.failed { color: #ff5f57; }
  .result.confirmed { color: #30d158; }
  .result.provisional { color: #ffd60a; }
  .result.none { color: #8e8e93; }
  .acct { border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .acct .row { display: flex; align-items: center; justify-content: space-between; }
  .src { font-size: 12px; color: #666; margin-top: 6px; display: flex;
         align-items: center; gap: 6px; }
  .danger { color: #ff5f57; border: 0; background: none; cursor: pointer; }
  section button { padding: 6px 10px; border: 1px solid #0ea371; border-radius: 6px;
                   background: #0ea371; color: #fff; cursor: pointer; }
  select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; background: inherit;
           color: inherit; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #e6e6e6; }
    th, td { border-bottom-color: #333; }
    .acct { border-color: #333; }
    .src { color: #999; }
  }
</style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" width="16" height="16" aria-hidden="true">
      <path d="M12 32 H21 L27 15 L35 47 L41 32 H52" fill="none"
            stroke="#0ea371" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <strong>qka</strong>
    <span class="spacer"></span>
    <button id="settings" title="设置">&#9881;</button>
  </header>

  <nav id="tabs">
    <button data-tab="apps" class="active">应用管理</button>
    <button data-tab="logs">日志</button>
    <button data-tab="accounts">账号管理</button>
    <button data-tab="agent">Agent 接入</button>
    <button data-tab="plugins">插件</button>
  </nav>

  <main>
    <section id="apps" class="tab active">
      <table>
        <thead><tr><th>应用</th><th>启用</th><th>健康</th><th>账号</th><th>今日</th><th>最近调用</th></tr></thead>
        <tbody id="apps-body"></tbody>
      </table>
    </section>
    <section id="logs" class="tab">
      <div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">
        <input id="log-target" placeholder="目标应用" style="width:120px;">
        <input id="log-account" placeholder="账号" style="width:100px;">
        <input id="log-operation" placeholder="操作" style="width:110px;">
        <select id="log-state" style="width:140px;">
          <option value="">状态（全部）</option>
          <option value="signed_confirmed">signed_confirmed</option>
          <option value="signed_provisional">signed_provisional</option>
          <option value="completed">completed</option>
          <option value="failed_retryable">failed_retryable</option>
          <option value="failed_final">failed_final</option>
        </select>
        <button id="log-query">查询</button>
      </div>
      <table>
        <thead><tr><th>时间</th><th>目标</th><th>账号</th><th>操作</th><th>状态</th><th>消息</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
      <div style="margin-top:8px;"><button id="logs-more">加载更多</button></div>
    </section>
    <section id="accounts" class="tab">
      <div style="margin-bottom:10px; display:flex; gap:8px;">
        <button data-act="discover">发现账号</button>
        <button data-act="login">官方登录添加</button>
        <select id="target-select" style="flex:1;">
          <option value="workbuddy-cn">WorkBuddy CN</option>
          <option value="qoder-cn">Qoder CN</option>
          <option value="qoder">Qoder</option>
          <option value="doubao-work">豆包工作</option>
        </select>
      </div>
      <div id="accounts-body"></div>
    </section>
    <section id="agent" class="tab">
      <div style="margin-bottom:10px; padding:8px; border-radius:6px; background:rgba(127,127,127,0.12);">
        计划由宿主保存，qka 不提供计划编辑器；宿主内部计划对 qka 不可观察（not_observable），因此不展示「计划已激活」。
      </div>
      <table>
        <thead><tr><th>宿主</th><th>配对</th><th>连通</th><th>最近调用</th><th>在宿主界面创建计划的指引</th></tr></thead>
        <tbody id="agent-body"></tbody>
      </table>
    </section>
    <section id="plugins" class="tab">
      <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="devmode-toggle"> 开发者模式（允许未签名适配器，每次加载需确认）
        </label>
      </div>
      <table>
        <thead><tr><th>适配器</th><th>版本</th><th>来源</th><th>签名/验证</th><th>更新状态</th></tr></thead>
        <tbody id="plugins-body"></tbody>
      </table>
      <h4 style="margin-top:14px;">受限加载审计</h4>
      <table>
        <thead><tr><th>时间</th><th>包名</th><th>动作</th></tr></thead>
        <tbody id="plugins-audit"></tbody>
      </table>
    </section>
  </main>

<script type="module">
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { Events } from "/wails/runtime.js";

  // Wails 对返回 json.RawMessage 的方法，前端拿到的是已解析对象（兼容字符串）。
  function asJSON(v) {
    if (typeof v === "string") return JSON.parse(v);
    return v;
  }

  // 五页签切换（顺序固定，由 DOM 决定）。
  const tabs = document.querySelectorAll("#tabs button");
  tabs.forEach(function (btn) {
    btn.onclick = function () {
      tabs.forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab").forEach(function (t) {
        t.classList.remove("active");
      });
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    };
  });

  document.getElementById("settings").onclick = function () {
    Events.Emit("open-settings");
  };

  // 应用管理页。
  const healthLabel = {
    healthy: "健康", reauth_required: "待重登",
    disabled: "已停用", no_account: "无账号",
  };
  const resultLabel = {
    confirmed: "已确认", provisional: "待复核",
    failed: "失败", none: "—",
  };
  const targetLabel = {
    "workbuddy-cn": "WorkBuddy CN", "qoder-cn": "Qoder CN",
    qoder: "Qoder", "doubao-work": "豆包工作",
  };

  async function renderApps() {
    const rows = asJSON(await Bound.AppsList());
    const body = document.getElementById("apps-body");
    body.innerHTML = "";
    rows.forEach(function (r) {
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + (targetLabel[r.target] || r.target) + "</td>" +
        "<td>" + (r.enabled ? "是" : "否") + "</td>" +
        '<td class="health ' + r.aggregate_health + '">' +
        (healthLabel[r.aggregate_health] || r.aggregate_health) + "</td>" +
        "<td>" + r.account_count + "</td>" +
        '<td class="result ' + r.today_result + '">' +
        (resultLabel[r.today_result] || r.today_result) + "</td>" +
        "<td>" + (r.last_invocation || "无") + "</td>";
      body.appendChild(tr);
    });
  }

  // 账号管理页（无任何密码/验证码/扫码输入）。
  async function renderAccounts() {
    const list = asJSON(await Bound.AccountsList());
    const body = document.getElementById("accounts-body");
    body.innerHTML = "";
    list.forEach(function (a) {
      const box = document.createElement("div");
      box.className = "acct";

      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.textContent = a.display_name + "（" + a.target + "）";
      const sw = document.createElement("input");
      sw.type = "checkbox";
      sw.checked = a.enabled;
      sw.onchange = function () {
        Bound.AccountsSetEnabled(a.target, a.id, sw.checked);
      };
      row.appendChild(name);
      row.appendChild(sw);
      box.appendChild(row);

      (a.sources || []).forEach(function (src) {
        const s = document.createElement("div");
        s.className = "src";
        const pin = document.createElement("input");
        pin.type = "checkbox";
        pin.title = "优先使用此来源";
        pin.checked = src.pinned;
        pin.onchange = function () {
          Bound.AccountsPinSource(a.target, a.id, src.id, pin.checked);
        };
        const text = document.createElement("span");
        text.textContent = src.kind + " · " + src.health + (src.read_only ? " · 只读" : "");
        s.appendChild(pin);
        s.appendChild(text);
        box.appendChild(s);
      });

      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "删除";
      del.onclick = function () {
        Bound.AccountsDelete(a.target, a.id).then(renderAccounts);
      };
      box.appendChild(del);

      body.appendChild(box);
    });
  }

  // 账号页顶部动作：发现 / 官方登录添加。
  document.querySelector('[data-act="discover"]').onclick = function () {
    const target = document.getElementById("target-select").value;
    Bound.AccountsDiscover(target).then(renderAccounts);
  };
  document.querySelector('[data-act="login"]').onclick = function () {
    const target = document.getElementById("target-select").value;
    Bound.AccountsBeginLogin(target);
  };

  // 日志页：四类筛选 + 游标加载更多。
  let logCursor = 0;
  function appendLogs(reset) {
    if (reset) {
      logCursor = 0;
      document.getElementById("logs-body").innerHTML = "";
    }
    Bound.LogsTail(
      document.getElementById("log-target").value,
      document.getElementById("log-account").value,
      document.getElementById("log-operation").value,
      document.getElementById("log-state").value,
      50, logCursor
    ).then(function (raw) {
      const page = asJSON(raw);
      const body = document.getElementById("logs-body");
      (page.entries || []).forEach(function (e) {
        const tr = document.createElement("tr");
        [e.ts, e.target, e.account_id, e.operation, e.state, e.message].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      logCursor = page.next_cursor || 0;
      document.getElementById("logs-more").style.display = logCursor ? "" : "none";
    });
  }
  document.getElementById("log-query").onclick = function () { appendLogs(true); };
  document.getElementById("logs-more").onclick = function () { appendLogs(false); };

  // Agent 接入页：配对/连通/最近调用/计划指引。
  function renderAgent() {
    Bound.AgentStatus().then(function (raw) {
      const view = asJSON(raw);
      const body = document.getElementById("agent-body");
      body.innerHTML = "";
      (view.hosts || []).forEach(function (h) {
        const tr = document.createElement("tr");
        [h.label, h.paired ? "已配对" : "未配对",
         h.connected ? "已连通" : "未连通",
         h.last_invocation || "—", h.schedule_guide].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    });
  }

  // 插件页：市场/签名/更新、开发者模式、审计。
  function renderPlugins() {
    Bound.PluginsList().then(function (raw) {
      const view = asJSON(raw);
      const body = document.getElementById("plugins-body");
      body.innerHTML = "";
      (view.plugins || []).forEach(function (p) {
        const tr = document.createElement("tr");
        const sig = p.signed ? "已签名/已验证" : "未验证";
        [p.name, p.version, p.source === "market" ? "市场" : "本地",
         sig, p.update_status].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      const audit = document.getElementById("plugins-audit");
      audit.innerHTML = "";
      (view.audit || []).forEach(function (a) {
        const tr = document.createElement("tr");
        [a.ts, a.package_name, a.action].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        audit.appendChild(tr);
      });
      document.getElementById("devmode-toggle").checked = !!view.dev_mode;
    });
  }
  document.getElementById("devmode-toggle").onchange = function () {
    Bound.SetDevMode(this.checked).then(renderPlugins);
  };

  renderApps();
  renderAccounts();
  appendLogs(true);
  renderAgent();
  renderPlugins();
</script>
</body>
</html>
