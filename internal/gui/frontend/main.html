<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex;
         flex-direction: column; }
  header { display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #ddd;
           -webkit-app-region: drag; }
  header .spacer { flex: 1; }
  #settings { -webkit-app-region: no-drag; border: 0; background: none; cursor: pointer;
              font-size: 16px; }
  nav { display: flex; border-bottom: 1px solid #ddd; }
  nav button { flex: 1; padding: 10px; border: 0; background: none; cursor: pointer;
               border-bottom: 2px solid transparent; }
  nav button.active { border-bottom-color: #0ea371; color: #0ea371; }
  main { flex: 1; padding: 16px; overflow: auto; overflow-x: hidden; }
  .tab { display: none; }
  .tab.active { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
  .health.reauth_required { color: #ff9f0a; }
  .health.disabled { color: #ff5f57; }
  .health.healthy { color: #30d158; }
  .health.no_account { color: #8e8e93; }
  .result.failed { color: #ff5f57; }
  .result.confirmed { color: #30d158; }
  .result.provisional { color: #ffd60a; }
  .result.none { color: #8e8e93; }
  .acct { border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .acct .row { display: flex; align-items: center; justify-content: space-between; }
  .src { font-size: 12px; color: #666; margin-top: 6px; display: flex;
         align-items: center; gap: 6px; }
  .login-status { margin: 0 0 12px; padding: 10px 12px; border: 1px solid #d8d8d8;
                  border-radius: 8px; background: rgba(127,127,127,0.06); }
  .login-status[hidden] { display: none; }
  .login-status .row { display: flex; align-items: center; justify-content: space-between;
                       gap: 8px; }
  .login-status p { margin: 6px 0 0; font-size: 13px; }
  .login-status small { display: block; margin-top: 6px; color: #777; }
  .login-status.pending_verification { border-color: #0ea371; }
  .login-status.verified { border-color: #30d158; }
  .login-status.failed, .login-status.expired, .login-status.reauth_required { border-color: #ff5f57; }
  .login-status.retryable { border-color: #ff9f0a; }
  #login-cancel { padding: 4px 8px; border: 1px solid #999; border-radius: 6px;
                  background: transparent; color: inherit; cursor: pointer; }
  #login-cancel[hidden] { display: none; }
  #login-retry { padding: 4px 8px; border: 1px solid #ff9f0a; border-radius: 6px;
                 background: transparent; color: inherit; cursor: pointer; }
  #login-retry[hidden] { display: none; }
  .accounts-message { margin: 0 0 10px; color: #ff5f57; font-size: 13px; }
  .accounts-message.success { color: #0a8f63; }
  .accounts-message.pending { color: #777; }
  .accounts-message[hidden] { display: none; }
  .empty-accounts { padding: 18px 12px; border: 1px dashed #bbb; border-radius: 8px;
                    color: #777; text-align: center; font-size: 13px; }
  .acct .state { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; font-size: 12px; }
  .acct .state .op { margin-bottom: 4px; }
  .acct .state .hint { color: #777; margin-top: 2px; }
  .acct .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .acct .actions button { padding: 4px 8px; border-radius: 6px; }
  .acct .actions button.secondary { border: 1px solid #999; background: transparent;
                                    color: inherit; }
  .acct .actions button[hidden] { display: none; }
  .danger { color: #ff5f57; border: 0; background: none; cursor: pointer; }
  button:disabled { cursor: wait; opacity: 0.55; }
  section button { padding: 6px 10px; border: 1px solid #0ea371; border-radius: 6px;
                   background: #0ea371; color: #fff; cursor: pointer; }
  select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; background: inherit;
           color: inherit; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #e6e6e6; }
    th, td { border-bottom-color: #333; }
    .acct { border-color: #333; }
    .src { color: #999; }
    .acct .state { border-top-color: #333; }
  }
</style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" width="16" height="16" aria-hidden="true">
      <path d="M12 32 H21 L27 15 L35 47 L41 32 H52" fill="none"
            stroke="#0ea371" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <strong>QKA</strong>
    <span class="spacer"></span>
    <button id="settings" title="设置">&#9881;</button>
  </header>

  <nav id="tabs">
    <button data-tab="apps" class="active">应用管理</button>
    <button data-tab="logs">日志</button>
    <button data-tab="accounts">账号管理</button>
    <button data-tab="agent">Agent 接入</button>
    <button data-tab="plugins">插件</button>
  </nav>

  <main>
    <section id="apps" class="tab active">
      <table>
        <thead><tr><th>应用</th><th>启用</th><th>健康</th><th>账号</th><th>今日</th><th>最近调用</th></tr></thead>
        <tbody id="apps-body"></tbody>
      </table>
    </section>
    <section id="logs" class="tab">
      <div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">
        <input id="log-target" placeholder="目标应用" style="width:120px;">
        <input id="log-account" placeholder="账号" style="width:100px;">
        <input id="log-operation" placeholder="操作" style="width:110px;">
        <select id="log-state" style="width:140px;">
          <option value="">状态（全部）</option>
          <option value="signed_confirmed">signed_confirmed</option>
          <option value="signed_provisional">signed_provisional</option>
          <option value="completed">completed</option>
          <option value="failed_retryable">failed_retryable</option>
          <option value="failed_final">failed_final</option>
        </select>
        <button id="log-query">查询</button>
      </div>
      <table>
        <thead><tr><th>时间</th><th>目标</th><th>账号</th><th>操作</th><th>状态</th><th>消息</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
      <div style="margin-top:8px;"><button id="logs-more">加载更多</button></div>
    </section>
    <section id="accounts" class="tab">
      <div style="margin-bottom:10px; display:flex; gap:8px;">
        <button data-act="discover">发现账号</button>
        <button data-act="login">官方登录添加</button>
        <span style="align-self:center; color:#777; font-size:13px;">WorkBuddy CN</span>
      </div>
      <p id="accounts-message" class="accounts-message" role="alert" hidden></p>
      <div id="login-status" class="login-status" role="status" aria-live="polite" hidden>
        <div class="row">
          <strong id="login-status-title">官方登录</strong>
          <span>
            <button id="login-retry" type="button" hidden>重试验证</button>
            <button id="login-cancel" type="button" hidden>取消登录</button>
          </span>
        </div>
        <p id="login-status-message"></p>
        <small id="login-status-origin"></small>
      </div>
      <div id="accounts-body"></div>
    </section>
    <section id="agent" class="tab">
      <div style="margin-bottom:10px; padding:8px; border-radius:6px; background:rgba(127,127,127,0.12);">
        计划由宿主保存，QKA 不提供计划编辑器；宿主内部计划对 QKA 不可观察（not_observable），因此不展示「计划已激活」。
      </div>
      <table>
        <thead><tr><th>宿主</th><th>配对</th><th>连通</th><th>最近调用</th><th>在宿主界面创建计划的指引</th></tr></thead>
        <tbody id="agent-body"></tbody>
      </table>
    </section>
    <section id="plugins" class="tab">
      <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="devmode-toggle"> 开发者模式（允许未签名适配器，每次加载需确认）
        </label>
      </div>
      <table>
        <thead><tr><th>适配器</th><th>版本</th><th>来源</th><th>签名/验证</th><th>更新状态</th></tr></thead>
        <tbody id="plugins-body"></tbody>
      </table>
      <h4 style="margin-top:14px;">受限加载审计</h4>
      <table>
        <thead><tr><th>时间</th><th>包名</th><th>动作</th></tr></thead>
        <tbody id="plugins-audit"></tbody>
      </table>
    </section>
  </main>

<script type="module">
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { Events } from "/wails/runtime.js";

  // Wails 对返回 json.RawMessage 的方法，前端拿到的是已解析对象（兼容字符串）。
  function asJSON(v) {
    if (typeof v === "string") return JSON.parse(v);
    return v;
  }

  // 五页签切换（顺序固定，由 DOM 决定）。
  const tabs = document.querySelectorAll("#tabs button");
  tabs.forEach(function (btn) {
    btn.onclick = function () {
      tabs.forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab").forEach(function (t) {
        t.classList.remove("active");
      });
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    };
  });

  document.getElementById("settings").onclick = function () {
    Events.Emit("open-settings");
  };

  // 应用管理页。
  const healthLabel = {
    healthy: "健康", reauth_required: "待重登",
    disabled: "已停用", no_account: "无账号",
  };
  const resultLabel = {
    confirmed: "已确认", provisional: "待复核",
    failed: "失败", none: "—",
  };
  const targetLabel = {
    "workbuddy-cn": "WorkBuddy CN", "qoder-cn": "Qoder CN",
    qoder: "Qoder", "doubao-work": "豆包工作",
  };

  async function renderApps() {
    const rows = asJSON(await Bound.AppsList());
    const body = document.getElementById("apps-body");
    body.innerHTML = "";
    rows.forEach(function (r) {
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + (targetLabel[r.target] || r.target) + "</td>" +
        "<td>" + (r.enabled ? "是" : "否") + "</td>" +
        '<td class="health ' + r.aggregate_health + '">' +
        (healthLabel[r.aggregate_health] || r.aggregate_health) + "</td>" +
        "<td>" + r.account_count + "</td>" +
        '<td class="result ' + r.today_result + '">' +
        (resultLabel[r.today_result] || r.today_result) + "</td>" +
        "<td>" + (r.last_invocation || "无") + "</td>";
      body.appendChild(tr);
    });
  }

  // 账号管理页（无任何密码/验证码/扫码输入）。
  const sourceKindLabel = {
    managed: "受管来源",
  };
  const sourceHealthLabel = {
    healthy: "健康",
    reauth_required: "待重登",
    disabled: "已停用",
  };
  const opStateLabel = {
    signed_confirmed: "已确认到账",
    signed_provisional: "已领取，待确认",
    already: "今日已领取",
    ineligible: "不符合活动资格",
    inactive: "活动未开始或已结束",
    manual_required: "应用内签到兜底",
    failed_retryable: "网络或上游暂时失败",
    failed_final: "执行失败",
    completed: "已完成",
    none: "尚未执行",
  };
  const opLabel = { checkin: "签到", keepalive: "保活" };

  function accountErrorMessage(err, fallback) {
    const text = err && err.message ? String(err.message) : String(err || "");
    // 只透出已知、可操作且不含账号秘密的后端原因。
    if (text.indexOf("无可用健康来源") !== -1) return text;
    if (text.indexOf("no rows") !== -1) return "账号不存在，请刷新列表后重试。";
    if (text.indexOf("network") !== -1 || text.indexOf("网络") !== -1 ||
        text.indexOf("timeout") !== -1 || text.indexOf("deadline") !== -1) {
      return "网络请求失败，请检查网络后重试；本次未宣称成功。";
    }
    return fallback;
  }

  async function runAccountAction(control, pending, success, failure, action, onFailure) {
    if (control) control.disabled = true;
    showAccountsMessage(pending, "pending");
    try {
      await action();
      if (control) control.disabled = false;
      await renderAccounts();
      showAccountsMessage(success, "success");
    } catch (err) {
      if (onFailure) onFailure();
      if (control) control.disabled = false;
      showAccountsMessage(accountErrorMessage(err, failure));
    }
  }

  function accountStatus(account) {
    const ops = account.operations || [];
    if (account.source_health === "reauth_required") {
      return {
        kind: "reauth",
        text: "来源需重新登录",
        hint: "请点击「重新登录」完成官方浏览器登录，再执行签到。",
      };
    }
    if (!(account.sources || []).some(function (src) { return src.health === "healthy"; })) {
      return {
        kind: "disabled",
        text: "无健康来源",
        hint: "请重新登录或重新发现账号，恢复健康来源后再启用。",
      };
    }
    if (ops.some(function (op) { return op.state === "manual_required"; })) {
      return {
        kind: "manual",
        text: "应用内签到兜底",
        hint: "请回 WorkBuddy 官方 App 完成签到，然后点击「只读复查」。",
      };
    }
    if (ops.some(function (op) { return op.state === "failed_retryable"; })) {
      return {
        kind: "failed",
        text: "网络请求失败或上游暂时失败",
        hint: "请检查网络后点击「立即签到」重试；本次未宣称成功。",
      };
    }
    return null;
  }

  async function renderAccounts() {
    let list;
    try {
      list = asJSON(await Bound.AccountsList());
      showAccountsMessage("");
    } catch (_) {
      showAccountsMessage("无法读取账号列表，请重试。");
      return;
    }
    const body = document.getElementById("accounts-body");
    body.innerHTML = "";
    if (!list || list.length === 0) {
      const emptyAccounts = document.createElement("div");
      emptyAccounts.className = "empty-accounts";
      emptyAccounts.textContent = "暂无 WorkBuddy CN 账号。请点击「官方登录添加」或「发现账号」。";
      body.appendChild(emptyAccounts);
      return;
    }
    list.forEach(function (a) {
      const box = document.createElement("div");
      box.className = "acct";

      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      const masked = a.masked_identity || "****";
      const display = a.display_name && a.display_name !== masked ? a.display_name + " · " : "";
      name.textContent = display + masked + "（" + (targetLabel[a.target] || a.target) + "）";
      const sw = document.createElement("input");
      sw.type = "checkbox";
      sw.checked = a.enabled;
      sw.onchange = function () {
        const enabled = sw.checked;
        runAccountAction(
          sw,
          enabled ? "正在启用…" : "正在停用…",
          enabled ? "账号已启用" : "账号已停用",
          enabled ? "启用失败，请检查来源健康状态后重试。" : "停用失败，请稍后重试。",
          function () { return Bound.AccountsSetEnabled(a.target, a.id, enabled); },
          function () { sw.checked = !enabled; }
        );
      };
      row.appendChild(name);
      row.appendChild(sw);
      box.appendChild(row);

      const state = accountStatus(a);
      if (state) {
        const status = document.createElement("div");
        status.className = "state";
        const title = document.createElement("div");
        title.textContent = state.text;
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = state.hint;
        status.appendChild(title);
        status.appendChild(hint);
        box.appendChild(status);
      }

      const operations = a.operations || [];
      if (operations.length) {
        const stateBox = document.createElement("div");
        stateBox.className = "state";
        operations.forEach(function (op) {
          const line = document.createElement("div");
          line.className = "op";
          line.textContent = (opLabel[op.operation] || op.operation) + "：" +
            (opStateLabel[op.state] || op.state);
          stateBox.appendChild(line);
          if (op.message) {
            const reason = document.createElement("div");
            reason.className = "hint";
            reason.textContent = op.message;
            stateBox.appendChild(reason);
          }
          if (op.next_action) {
            const next = document.createElement("div");
            next.className = "hint";
            next.textContent = "下一步：" + op.next_action;
            stateBox.appendChild(next);
          }
        });
        box.appendChild(stateBox);
      }

      (a.sources || []).forEach(function (src) {
        const s = document.createElement("div");
        s.className = "src";
        const text = document.createElement("span");
        text.textContent =
          (sourceKindLabel[src.kind] || src.kind) + " · " +
          (sourceHealthLabel[src.health] || src.health) +
          (src.read_only ? " · 只读" : "");
        s.appendChild(text);
        box.appendChild(s);
      });

      const actions = document.createElement("div");
      actions.className = "actions";
      if (a.target === "workbuddy-cn") {
        const login = document.createElement("button");
        login.className = "secondary";
        login.textContent = "重新登录";
        login.onclick = function () {
          runAccountAction(
            login,
            "正在发起官方登录与只读验证…",
            "官方登录流程已发起",
            "无法发起官方登录，请重试；未创建账号。",
            function () { return beginLogin("workbuddy-cn"); }
          );
        };
        actions.appendChild(login);

        const refresh = document.createElement("button");
        refresh.className = "secondary";
        refresh.textContent = "刷新状态";
        refresh.onclick = function () {
          runAccountAction(
            refresh,
            "正在刷新登录状态与只读验证结果…",
            "状态已刷新",
            "刷新状态失败，请稍后重试。",
            async function () {
              await refreshLogin("workbuddy-cn");
              await renderAccounts();
            }
          );
        };
        actions.appendChild(refresh);

        const run = document.createElement("button");
        const manual = operations.some(function (op) {
          return op.operation === "checkin" && op.state === "manual_required";
        });
        run.textContent = manual ? "只读复查" : "立即签到";
        run.disabled = !a.enabled;
        run.title = a.enabled ? "" : "请先启用账号";
        run.onclick = function () {
          runAccountAction(
            run,
            manual ? "正在只读复查今日签到…" : "正在执行签到…",
            manual ? "复查完成" : "签到操作完成",
            "签到执行失败，请稍后重试；本次未宣称成功。",
            function () { return Bound.AccountsRun(a.target, a.id, "checkin"); }
          );
        };
        actions.appendChild(run);
      }

      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "删除";
      del.onclick = function () {
        runAccountAction(
          del,
          "正在删除账号…",
          "账号已删除",
          "删除失败，请稍后重试。",
          function () { return Bound.AccountsDelete(a.target, a.id); }
        );
      };
      actions.appendChild(del);
      box.appendChild(actions);

      body.appendChild(box);
    });
  }

  // 账号页顶部动作：发现 / 官方登录添加。
  const loginStatusLabel = {
    idle: "官方登录",
    pending: "等待官方登录",
    pending_verification: "授权已取得，等待只读验证",
    verified: "只读验证通过",
    reauth_required: "需要重新登录",
    retryable: "只读验证可重试",
    cancelled: "官方登录已取消",
    expired: "官方登录已超时",
    failed: "官方登录失败",
  };
  let loginTimer = null;

  function stopLoginPolling() {
    if (loginTimer !== null) {
      clearTimeout(loginTimer);
      loginTimer = null;
    }
  }

  function renderLogin(view) {
    stopLoginPolling();
    const box = document.getElementById("login-status");
    box.hidden = false;
    box.className = "login-status " + (view.status || "");
    document.getElementById("login-status-title").textContent =
      loginStatusLabel[view.status] || "官方登录";
    document.getElementById("login-status-message").textContent = view.message || "";
    const origin = document.getElementById("login-status-origin");
    origin.textContent = view.official_origin ? "官方入口：" + view.official_origin : "";
    const cancel = document.getElementById("login-cancel");
    cancel.hidden = !view.can_cancel;
    cancel.dataset.target = view.target || "";
    const retry = document.getElementById("login-retry");
    retry.hidden = view.status !== "retryable";
    retry.dataset.target = view.target || "";

    if (view.status === "pending" || view.status === "pending_verification") {
      loginTimer = setTimeout(function () { refreshLogin(view.target); }, 1000);
    }
    if (view.status === "verified") {
      renderAccounts().catch(function () {
        showAccountsMessage("账号已通过只读验证，但列表刷新失败；请点击「刷新状态」重试。");
      });
    }
  }

  async function refreshLogin(target) {
    if (!target) return;
    try {
      renderLogin(asJSON(await Bound.AccountsLoginStatus(target)));
    } catch (err) {
      renderLogin({
        target: target,
        status: "failed",
        message: "无法读取官方登录状态，请重试；未创建账号",
        can_cancel: false,
      });
      throw err;
    }
  }

  function showAccountsMessage(message, kind) {
    const el = document.getElementById("accounts-message");
    el.textContent = message;
    el.hidden = !message;
    el.className = "accounts-message" + (kind ? " " + kind : "");
    el.setAttribute("role", kind === "success" ? "status" : "alert");
  }

  document.querySelector('[data-act="discover"]').onclick = async function () {
    const target = "workbuddy-cn";
    try {
      await Bound.AccountsDiscover(target);
      showAccountsMessage("");
      await renderAccounts();
    } catch (_) {
      showAccountsMessage("发现账号失败，请重试。");
    }
  };

  async function beginLogin(target) {
    try {
      renderLogin(asJSON(await Bound.AccountsBeginLogin(target)));
    } catch (err) {
      renderLogin({
        target: target,
        status: "failed",
        message: "无法发起官方登录，请重试；未创建账号",
        can_cancel: false,
      });
      throw err;
    }
  }

  document.querySelector('[data-act="login"]').onclick = function () {
    const button = this;
    runAccountAction(
      button,
      "正在发起官方登录与只读验证…",
      "官方登录流程已发起",
      "无法发起官方登录，请重试；未创建账号。",
      function () { return beginLogin("workbuddy-cn"); }
    );
  };
  document.getElementById("login-retry").onclick = function () {
    const button = this;
    if (button.dataset.target) {
      runAccountAction(
        button,
        "正在重试只读验证…",
        "只读验证已完成",
        "只读验证失败，请重新登录；未创建账号。",
        function () { return beginLogin(button.dataset.target); }
      );
    }
  };
  document.getElementById("login-cancel").onclick = async function () {
    const target = this.dataset.target;
    if (!target) return;
    try {
      renderLogin(asJSON(await Bound.AccountsCancelLogin(target)));
    } catch (_) {
      await refreshLogin(target);
    }
  };

  // 日志页：四类筛选 + 游标加载更多。
  let logCursor = 0;
  function appendLogs(reset) {
    if (reset) {
      logCursor = 0;
      document.getElementById("logs-body").innerHTML = "";
    }
    Bound.LogsTail(
      document.getElementById("log-target").value,
      document.getElementById("log-account").value,
      document.getElementById("log-operation").value,
      document.getElementById("log-state").value,
      50, logCursor
    ).then(function (raw) {
      const page = asJSON(raw);
      const body = document.getElementById("logs-body");
      (page.entries || []).forEach(function (e) {
        const tr = document.createElement("tr");
        [e.ts, e.target, e.account_id, e.operation, e.state, e.message].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      logCursor = page.next_cursor || 0;
      document.getElementById("logs-more").style.display = logCursor ? "" : "none";
    });
  }
  document.getElementById("log-query").onclick = function () { appendLogs(true); };
  document.getElementById("logs-more").onclick = function () { appendLogs(false); };

  // Agent 接入页：配对/连通/最近调用/计划指引。
  function renderAgent() {
    Bound.AgentStatus().then(function (raw) {
      const view = asJSON(raw);
      const body = document.getElementById("agent-body");
      body.innerHTML = "";
      (view.hosts || []).forEach(function (h) {
        const tr = document.createElement("tr");
        [h.label, h.paired ? "已配对" : "未配对",
         h.connected ? "已连通" : "未连通",
         h.last_invocation || "—", h.schedule_guide].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    });
  }

  // 插件页：市场/签名/更新、开发者模式、审计。
  function renderPlugins() {
    Bound.PluginsList().then(function (raw) {
      const view = asJSON(raw);
      const body = document.getElementById("plugins-body");
      body.innerHTML = "";
      (view.plugins || []).forEach(function (p) {
        const tr = document.createElement("tr");
        const sig = p.signed ? "已签名/已验证" : "未验证";
        [p.name, p.version, p.source === "market" ? "市场" : "本地",
         sig, p.update_status].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      const audit = document.getElementById("plugins-audit");
      audit.innerHTML = "";
      (view.audit || []).forEach(function (a) {
        const tr = document.createElement("tr");
        [a.ts, a.package_name, a.action].forEach(function (v) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        audit.appendChild(tr);
      });
      document.getElementById("devmode-toggle").checked = !!view.dev_mode;
    });
  }
  document.getElementById("devmode-toggle").onchange = function () {
    Bound.SetDevMode(this.checked).then(renderPlugins);
  };

  renderApps();
  renderAccounts();
  appendLogs(true);
  renderAgent();
  renderPlugins();
</script>
</body>
</html>
