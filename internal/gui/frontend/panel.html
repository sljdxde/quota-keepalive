<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 12px; width: 300px;
         background: #1e1e1e; color: #e6e6e6; font-size: 13px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .acct { padding: 6px 0; border-top: 1px solid #333; }
  .state { float: right; }
  .state.failed { color: #ff5f57; }
  .state.ok { color: #30d158; }
  .state.pending { color: #ffd60a; }
  .meta { color: #999; font-size: 11px; margin-top: 4px; }
  button { margin-top: 10px; width: 100%; padding: 6px; border: 0; border-radius: 6px;
           background: #0a84ff; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h1>qka</h1>
  <div id="accounts"></div>
  <div class="meta" id="lastInvocation"></div>
  <button id="run">立即执行</button>

<script type="module">
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { Window } from "/wails/runtime.js";

  // Esc 关闭面板（不抢焦点；失焦即隐由原生 AttachWindow 提供）。
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") Window.Hide();
  });

  const qka = {
    status: async function () {
      return JSON.parse(await Bound.Status());
    },
    run: function () {
      return Bound.Run();
    },
  };

  function renderStatus(view) {
    const box = document.getElementById("accounts");
    box.innerHTML = "";
    (view.accounts || []).forEach(function (a) {
      const div = document.createElement("div");
      div.className = "acct";
      const state = (a.operations[0] && a.operations[0].state) || "pending";
      const cls = state.indexOf("failed") >= 0 ? "failed"
                : state.indexOf("confirmed") >= 0 || state.indexOf("completed") >= 0 ? "ok"
                : "pending";
      div.innerHTML = a.display_name + '<span class="state ' + cls + '">' + state + "</span>";
      box.appendChild(div);
    });
    document.getElementById("lastInvocation").textContent =
      "最近调用: " + (view.last_invocation || "无");
  }

  async function refresh() {
    renderStatus(await qka.status());
  }

  document.getElementById("run").onclick = async function () {
    // 立即执行走同一服务链（Bound.Run 内部先预演）。
    await qka.run();
    await refresh();
  };

  refresh();
</script>
</body>
</html>
