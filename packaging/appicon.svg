    </filter>
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="216"/>
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
    <g clip-path="url(#tileClip)">
      <rect x="64" y="64" width="896" height="896" fill="url(#coolBloom)"/>
      <rect x="64" y="64" width="896" height="896" fill="url(#warmBloom)"/>
      <ellipse cx="380" cy="204" rx="350" ry="250" fill="url(#sheen)" transform="rotate(-18 380 204)"/>
    </g>
    <rect x="64" y="64" width="896" height="896" rx="216" fill="none" stroke="url(#rim)" stroke-width="20"/>
    <rect x="78" y="78" width="868" height="868" rx="203" fill="none" stroke="#EDFFFB" stroke-opacity="0.18" stroke-width="4"/>
  </g>

  <g transform="translate(512 512) scale(0.66) translate(-562 -536)">
    <path d="M774 620A300 300 0 1 0 603 780"
          fill="none" stroke="#F1E2C7" stroke-width="126" stroke-linecap="round"
