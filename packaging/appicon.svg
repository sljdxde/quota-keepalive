    <path d="M617 769C686 815 762 855 858 892"
          fill="none" stroke="#FFD06B" stroke-width="126" stroke-linecap="round"
          opacity="0.2" filter="url(#tailGlow)"/>
    <path d="M774 620A300 300 0 1 0 603 780"
          fill="none" stroke="url(#ring)" stroke-width="108" stroke-linecap="round"/>
    <path d="M617 769C686 815 762 855 858 892"
          fill="none" stroke="url(#tail)" stroke-width="92" stroke-linecap="round"/>
    <path d="M774 620A300 300 0 0 1 625 752"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"
