name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that matches package.json, for example v0.1.1
        required: true
        type: string
      dry-run:
        description: Validate and pack without publishing to npm
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Validate release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publishing must be started from main." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1: $SOURCE_REF" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "v$PACKAGE_VERSION" != "$SOURCE_REF" ]]; then
            echo "Tag $SOURCE_REF does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests
        run: bun test --coverage

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check index.js
          for file in src/*.js test/*.js ui/app.js; do
            node --check "$file"
          done

      - name: Set up Node and npm for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public --tag latest

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: echo "Validation and npm pack succeeded; no package was published."
